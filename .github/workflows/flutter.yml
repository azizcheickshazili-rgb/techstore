name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Generate Flutter platform projects
        run: flutter create . --platforms android,web

      - name: Verify Flutter Web configuration
        run: test -f web/index.html

      - name: Verify Flutter Android configuration
        run: test -f android/app/build.gradle.kts || test -f android/app/build.gradle

      - name: Build web
        run: flutter build web --release

      - name: Build Android APK
        run: flutter build apk --release

      - name: Package APK
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/techstore-release.apk
          cd artifacts
          zip -9 techstore-release-apk.zip techstore-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: techstore-android-apk
          path: artifacts/techstore-release-apk.zip
          if-no-files-found: error

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: techstore-web-build
          path: build/web
          if-no-files-found: error
